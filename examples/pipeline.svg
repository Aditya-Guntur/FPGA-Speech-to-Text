    .sub { font-size:9.5px; fill:#55616e; text-anchor:middle; }
    .edge { stroke:#555; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  </style>

  <rect x="10" y="90" width="90" height="60" class="blk"/>
